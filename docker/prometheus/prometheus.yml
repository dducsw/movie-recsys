global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "movienex-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000", "host.docker.internal:8000"]
        labels:
          application: "movienex-api"
          environment: "production"
