# docker-compose.prod.yml — production overlay (no dev ports, resource limits)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    ports: []
    command: postgres -c max_connections=200
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  redis:
    ports: []
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  qdrant:
    ports: []
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  backend:
    profiles: ["app"]
    environment:
      - ENV=production
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2", memory: 2G }

  frontend:
    profiles: ["app"]

  prometheus:
    ports: []
