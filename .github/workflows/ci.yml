name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: API, Core & Training Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -e libs/recsys_core
          pip install pytest pytest-cov ruff

      - name: Lint (Ruff)
        run: |
          ruff check libs/recsys_core/src \
            pipelines/training/validate.py \
            pipelines/training/versioning.py \
            pipelines/training/parity_check.py \
            pipelines/training/train_pipeline.py \
            pipelines/training/full_eval.py \
            pipelines/training/ml_training/src \
            pipelines/batch/backfill_qdrant.py \
            apps/api/app/services

      - name: Run Test Suite
        env:
          PYTHONPATH: apps/api:libs/recsys_core/src:pipelines/training:pipelines/training/ml_training/src
        run: |
          pytest apps/api/tests pipelines/training/tests libs/recsys_core/tests -v --durations=10 \
            --cov=recsys_core --cov=apps/api/app/services --cov=pipelines/training \
            --cov-report=term-missing --cov-fail-under=35

  frontend:
    name: Frontend Client Build & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build Frontend
        working-directory: apps/web
        run: |
          npm install
          npm run build
