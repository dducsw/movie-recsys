name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: API, Core & Training Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -e libs/recsys_core
          pip install pytest pytest-cov

      - name: Run Test Suite
        env:
          PYTHONPATH: apps/api:libs/recsys_core/src:pipelines/training:pipelines/training/ml_training/src
        run: |
          pytest apps/api/tests pipelines/training/tests libs/recsys_core/tests -v --durations=10 --cov=recsys_core --cov-report=term-missing
