paths:
  crawled: ../../data/crawler/movies_crawled.csv
  links: ../../data/ml-latest-small/links.csv
  movies: ../../data/ml-latest-small/movies.csv
  ratings: ../../data/ml-latest-small/ratings.csv

split:
  method: "time_by_user"
  n_holdout_per_user: 5
  val_frac_of_train: 0.1
  min_user_ratings: 5
  random_state: 42

features:
  top_n_directors: 200
  top_n_actors: 500
  top_n_keywords: 300
  genre_list: ["Action","Adventure","Animation","Children","Comedy","Crime",
               "Documentary","Drama","Fantasy","Film-Noir","Horror","Musical",
               "Mystery","Romance","Sci-Fi","Thriller","War","Western","IMAX"]

lgbm:
  objective: "regression"
  metric: ["rmse", "mae"]
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  min_data_in_leaf: 30
  lambda_l2: 1.0
  n_estimators: 3000
  early_stopping_rounds: 100
  verbose: -1
  # Reproducibility: every RNG used by LightGBM is pinned here.
  seed: 42
  bagging_seed: 42
  feature_fraction_seed: 42
  data_random_seed: 42
  deterministic: true
  force_row_wise: true

catboost:
  loss_function: "RMSE"
  eval_metric: "RMSE"
  learning_rate: 0.05
  depth: 8
  l2_leaf_reg: 3.0
  iterations: 3000
  early_stopping_rounds: 100
  # "CPU" is the safe default (the Docker Compose stack has no verified GPU
  # passthrough).  Switch to "GPU" only on hosts with a verified GPU.
  task_type: "CPU"
  random_seed: 42
  verbose: 200

tuning:
  n_trials: 30
  seed: 42
  study_prefix: "movie-recsys"

quality_gates:
  # Absolute thresholds.
  min_rmse: 1.05
  min_ndcg: 0.05
  min_hr: 0.15
  min_users_evaluated: 20
  # Relative comparison against the currently promoted model.
  min_rmse_improvement_pct: 0.005
  max_ndcg_regression: 0.003

evaluation:
  k: 10
  relevance_threshold: 4.0
  bootstrap_iters: 1000

ensemble:
  # Stage 2 blending weights (validated offline via A/B NDCG@10 comparing
  # CatBoost ranking quality vs. LightGBM speed).  Recorded into the published
  # bundle as ``ensemble_weights`` so serving follows training by default;
  # ops can still override per-deployment via ``RECSYS_CB_WEIGHT`` /
  # ``RECSYS_LGB_WEIGHT``.
  catboost_weight: 0.6
  lightgbm_weight: 0.4

recommend:
  top_k: 10
  candidate_pool_size: 500
