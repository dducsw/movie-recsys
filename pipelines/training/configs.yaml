# Configuration for Continuous Training (CT) Pipeline
ranker:
  n_estimators: 100
  learning_rate: 0.05
  num_leaves: 15
  min_child_samples: 5
  objective: lambdarank
  metric: ndcg
  eval_at: [5, 10]

# True implicit ALS (Hu-Koren-Volinsky confidence: c = 1 + alpha * r)
ials:
  factors: 32
  regularization: 0.01
  iterations: 20
  alpha: 40.0
  random_state: 42

# Mixed negative sampling: uniform (easy) + popularity-weighted (hard)
sampling:
  n_neg_ratio: 0.5  # negatives per positive = len(group) * ratio, min 1
  hard_ratio: 0.5
  seed: 42

# Semantic embeddings pinned for Qdrant (must match collection dim)
embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2
  dim: 384

# CT promotion gates — fail the run if any threshold is breached
quality_gates:
  min_hr: 0.15
  min_ndcg: 0.12
  min_ild: 0.30
  max_latency_ms: 30.0
  # A gate must never pass on a handful of users.
  min_users_evaluated: 1
  # Incumbent comparison: challenger must beat the champion, not just pass.
  # min_rmse_improvement_pct: 0.005   # enable after the first promotion
  max_ndcg_regression: 0.003

# Fast CT uses 99-neg protocol; nightly full_eval.py scans full catalog
evaluation:
  ct_protocol_neg: 99
  ct_max_users: 200
  k: 10
