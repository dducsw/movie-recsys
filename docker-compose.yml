services:
  # 1. Relational Database & Offline Feature Store
  postgres:
    image: postgres:15-alpine
    container_name: movie-recsys-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-movie_db}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-movie_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. In-Memory Cache & Online Feature Store (Fast Retrieval Cache)
  redis:
    image: redis:7-alpine
    container_name: movie-recsys-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Vector Database (Candidate Retrieval / Embedding Search)
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: movie-recsys-qdrant
    ports:
      - "6333:6333" # HTTP API & Web UI
      - "6334:6334" # gRPC API
    volumes:
      - qdrantdata:/qdrant/storage

  # 4. Object Storage (SeaweedFS S3-compatible for Models & Large Data Artifacts)
  seaweedfs:
    image: chrislusf/seaweedfs:3.59
    container_name: movie-recsys-seaweedfs
    command: "server -s3 -s3.port=8333"
    ports:
      - "8333:8333" # S3 API Port
      - "9333:9333" # Master Port
      - "8888:8888" # Filer Port
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs-init:
    image: amazon/aws-cli:latest
    container_name: movie-recsys-seaweedfs-init
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${SEAWEEDFS_ACCESS_KEY:-seaweedfskey}
      - AWS_SECRET_ACCESS_KEY=${SEAWEEDFS_SECRET_KEY:-seaweedfssecret}
      - AWS_EC2_METADATA_DISABLED=true
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://mlflow --region us-east-1 || true;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://recsys-data --region us-east-1 || true;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://feature-store --region us-east-1 || true;
      exit 0;
      "

  # 5. ML Experiment Tracking & Model Registry
  mlflow:
    build:
      context: .
      dockerfile: ./docker/mlflow/Dockerfile
    container_name: movie-recsys-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${SEAWEEDFS_ACCESS_KEY:-seaweedfskey}
      - AWS_SECRET_ACCESS_KEY=${SEAWEEDFS_SECRET_KEY:-seaweedfssecret}
      - MLFLOW_S3_ENDPOINT_URL=http://seaweedfs:8333
      - MLFLOW_S3_IGNORE_TLS=true
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/mlflow_db
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000

  # 6. WebApp Backend (FastAPI - Profile: app)
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: movie-recsys-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SEAWEEDFS_FILER_URL=http://seaweedfs:8888

  # 7. WebApp Frontend (React + Nginx - Profile: app)
  frontend:
    profiles: ["app"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: movie-recsys-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  # 8. Prometheus Telemetry & Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: movie-recsys-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  qdrantdata:
    driver: local
  seaweeddata:
    driver: local
  prometheusdata:
    driver: local
